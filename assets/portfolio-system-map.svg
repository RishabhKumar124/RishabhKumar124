<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rishabh Kumar portfolio system map</title>
  <desc id="desc">A recruiter-facing visual map showing product instinct, AI systems, frontend craft, and shipping discipline.</desc>
  
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .flow-line {
      stroke-dasharray: 8;
      animation: flow 1.5s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -16; }
    }
    .box1 { transform-origin: center; animation: float 6s ease-in-out infinite; }
    .box2 { transform-origin: center; animation: float 6s ease-in-out infinite -2s; }
    .box3 { transform-origin: center; animation: float 6s ease-in-out infinite -4s; }
    .box4 { transform-origin: center; animation: float 6s ease-in-out infinite -1s; }
  </style>

  <rect width="1280" height="440" rx="28" fill="#0F172A"/>
  <rect x="30" y="30" width="1220" height="380" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="72" y="88" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">I build AI products where the hard part is judgment.</text>
  <text x="72" y="124" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Product framing, trustworthy AI boundaries, crisp interfaces, and production discipline in one loop.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#94A3B8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Horizontal Arrows -->
  <path d="M317 283H427" stroke="#94A3B8" stroke-width="3" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M687 283H797" stroke="#94A3B8" stroke-width="3" class="flow-line" marker-end="url(#arrow)"/>
  <path d="M1057 283H1077" stroke="#94A3B8" stroke-width="3" class="flow-line" marker-end="url(#arrow)"/>

  <!-- Box 1 -->
  <g class="box1">
    <rect x="72" y="188" width="245" height="190" rx="16" fill="#164E63" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <text x="102" y="234" fill="#ECFEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Product Instinct</text>
    <text x="102" y="274" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Start from the decision</text>
    <text x="102" y="304" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Name the user pressure</text>
    <text x="102" y="334" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Design for real usage</text>
  </g>

  <!-- Box 2 -->
  <g class="box2">
    <rect x="442" y="188" width="245" height="190" rx="16" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" filter="url(#glow)"/>
    <text x="472" y="234" fill="#EFF6FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">AI System Design</text>
    <text x="472" y="274" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Deterministic core</text>
    <text x="472" y="304" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Structured research</text>
    <text x="472" y="334" fill="#DBEAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Sources and uncertainty</text>
  </g>

  <!-- Box 3 -->
  <g class="box3">
    <rect x="812" y="188" width="245" height="190" rx="16" fill="#7C2D12" stroke="#FB923C" stroke-width="2" filter="url(#glow)"/>
    <text x="842" y="234" fill="#FFF7ED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Frontend Craft</text>
    <text x="842" y="274" fill="#FFEDD5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Fast scan patterns</text>
    <text x="842" y="304" fill="#FFEDD5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Mobile field workflow</text>
    <text x="842" y="334" fill="#FFEDD5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Calm dense UI</text>
  </g>

  <!-- Box 4 (Ship) -->
  <g class="box4">
    <rect x="1092" y="188" width="116" height="190" rx="16" fill="#F8FAFC" filter="url(#glow)"/>
    <text x="1150" y="246" text-anchor="middle" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Ship</text>
    <text x="1150" y="286" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">test</text>
    <text x="1150" y="316" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">deploy</text>
    <text x="1150" y="346" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">explain</text>
  </g>
</svg>
